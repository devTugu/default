services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    command: ['--config=/etc/otel-collector-config.yaml']
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - '4318:4318'

  jaeger:
    image: jaegertracing/all-in-one:1.64
    ports:
      - '16686:16686'
